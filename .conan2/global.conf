# Parallel build jobs. 0 means "let Conan decide" in some contexts but
# is forwarded verbatim to OpenSSL's Configure as `make -j0`, which GNU
# make rejects ("the '-j' option requires a positive integer argument").
# Empty / unset = Conan auto-detects via os.cpu_count().
