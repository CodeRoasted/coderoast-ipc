name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '.conan2/**'
      - 'conanfile.py'
      - 'core/**'
      - 'consumer/**'
      - 'producer/**'
      - 'CMakeLists.txt'
      - 'CMakeUserPresets.json'
      - 'packages.yml'

permissions:
  contents: write
  pull-requests: write   # Sift dogfood: comment on same-repo PRs + seed on push; fork PRs skipped (read-only token anyway)
  actions: write         # Sift dogfood: upload the baseline-log artifact (+ read for last-green resolution)

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      CONAN_PROFILE: linux-gcc15-release

    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common && sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test && sudo apt-get update && sudo apt-get install -y ninja-build python3-pip build-essential gcc-15 g++-15
          # Pin the dev-validated CMake 4.3.x workspace-wide (dev/CI parity). coderoast_server arms
          # `import std` (CXX_MODULE_STD, gated by the experimental UUID 451f2fe2 — present only in
          # CMake 4.3.x); Ubuntu's apt cmake (Noble 3.28) lacks that gate. Harmless / kept consistent
          # in repos that don't arm import std yet.
          sudo python3 -m pip install --break-system-packages "cmake==4.3.1"
          hash -r
          case "$(cmake --version | head -1)" in *" 4.3."*) cmake --version ;; *) echo "::error::expected CMake 4.3.x (got: $(cmake --version | head -1))"; exit 1 ;; esac

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          version: "2.28.1"
          home: ${{ env.CONAN_HOME }}
          cache_packages: true
          profile_detect: false

      - name: Setup Conan profile
        run: |
          mkdir -p "$CONAN_HOME/profiles"
          cp linux-gcc15-release "$CONAN_HOME/profiles/$CONAN_PROFILE"

      - name: Start build-log capture (the conan-module steps below append; Sift diffs it)
        run: truncate --size 0 "$GITHUB_WORKSPACE/build.log"

      - name: Build root meta-package
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1   # capture the conan-module output for the Sift dogfood
          conan create . \
            --profile:host="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --profile:build="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --build=missing

      - name: Build and test core package
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1   # capture the conan-module output for the Sift dogfood
          conan create core \
            --profile:host="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --profile:build="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --build=missing
          
          # Build and run tests from source with Conan dependencies
          conan install core \
            --profile:host="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --profile:build="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --build=missing \
            -of core/build_test
          cmake --preset conan-release -S core -B core/build_test \
            -DCODEROAST_IPC_CORE_BUILD_TESTS=ON -DCODEROAST_IPC_CORE_BUILD_BENCH=ON
          cmake --build core/build_test
          ctest --test-dir core/build_test --output-on-failure

      - name: Build and test consumer package
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1   # capture the conan-module output for the Sift dogfood
          conan create consumer \
            --profile:host="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --profile:build="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --build=missing
          
          # Build and run tests from source with Conan dependencies
          conan install consumer \
            --profile:host="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --profile:build="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --build=missing \
            -of consumer/build_test
          cmake --preset conan-release -S consumer -B consumer/build_test \
            -DCODEROAST_IPC_CONSUMER_BUILD_TESTS=ON
          cmake --build consumer/build_test
          ctest --test-dir consumer/build_test --output-on-failure

      - name: Build and test producer package
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1   # capture the conan-module output for the Sift dogfood
          conan create producer \
            --profile:host="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --profile:build="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --build=missing
          
          # Build and run tests from source with Conan dependencies
          conan install producer \
            --profile:host="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --profile:build="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --build=missing \
            -of producer/build_test
          cmake --preset conan-release -S producer -B producer/build_test \
            -DCODEROAST_IPC_PRODUCER_BUILD_TESTS=ON
          cmake --build producer/build_test
          ctest --test-dir producer/build_test --output-on-failure

      - name: Sift — structural diff of this run's build+test log (advisory)
        if: ${{ always() && github.event.pull_request.head.repo.fork != true }}
        continue-on-error: true    # advisory: a Sift error must NEVER fail this build
        uses: CodeRoasted/sift-action@v1
        with:
          log: build.log
          fail-on: none
          commit-comment: regression
          build-status: ${{ job.status == 'success' && 'green' || 'red' }}