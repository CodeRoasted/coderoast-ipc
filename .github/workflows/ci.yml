name: CI

# This repository's CI: the preflight (cheap checks) and the build (malf-toolchain's coderoast-build.yml:
# the clang-21 dev build of core, consumer and producer with every test; test on clang, ship gcc). With
# postflight, clang-tidy runs over that same build in the build job, because only that job holds it. The
# two jobs do not wait for each other, so a red preflight never hides the build's or the lint's verdict.
# PUBLIC repository: every job runs on GitHub-hosted machines.

on:
  workflow_dispatch:
    inputs:
      postflight:
        description: 'Run clang-tidy over the dev build (the postflight), in the build job.'
        type: boolean
        default: false
  workflow_call:
    inputs:
      postflight:
        description: 'Run clang-tidy over the dev build (the postflight), in the build job.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read   # malf's conan cache restore reads this job's runner group (actions-cache-allowed.sh)

jobs:
  preflight:
    uses: ./.github/workflows/preflight.yml

  build:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-build.yml@3409812bc455209ecef668f76c44b132b496e509
    with:
      postflight: ${{ inputs.postflight }}

  # Sift, integrated the way any user integrates it (the Founder, 2026-10-27): the published Action
  # from the marketplace, in a job of its own that diffs the build job's log (`target-job`) against
  # the last green run of this workflow. Advisory: `fail-on` stays `none`, and `always()` diffs a red
  # build too, which is when the diff matters.
  sift:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read   # the build job's log and the baseline artifact
    steps:
      - name: Sift — the build log against the last green run
        uses: CodeRoasted/sift-action@02066069ff16d9b8ce2487b19a3686a3acdf24d7 # v2.0.0
        with:
          target-job: build
