name: Prune

# This repository prunes its own store (DN-142.D32 (2)), dispatched by the superproject's `pharos cut` once every
# release of a cut is green: every version of ghcr.io/<owner>/store-coderoast-ipc that the cut's keep-set does not name is
# deleted with this repository's own token. The keep-set is read from the cut run's artifact and held to the digest
# the dispatcher read (malf's coderoast-prune.yml); `apply: false`, the default, prints what would be deleted.

on:
  workflow_dispatch:
    inputs:
      cut-run:
        description: 'The superproject cut.yml run whose artifact cut-keep-set holds the keep-set.'
        type: string
        required: true
      keep-set-sha256:
        description: 'The sha256 of keep-set.json, as pharos cut read it from that artifact.'
        type: string
        required: true
      apply:
        description: 'Delete (true), or print what would be deleted (false).'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  prune:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-prune.yml@fcb3150394e80226ca5d4a1ea7cdb0165150548a
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      cut-run: ${{ inputs.cut-run }}
      keep-set-sha256: ${{ inputs.keep-set-sha256 }}
      apply: ${{ inputs.apply }}
    secrets:
      BUILD_RECORD_READ_TOKEN: ${{ secrets.BUILD_RECORD_READ_TOKEN }}
