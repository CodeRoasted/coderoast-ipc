name: Lint

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-lint.yml@78df2432b7021c3af8851848f59f43532deddb9a
    permissions:
      contents: read
      actions: read   # malf's conan cache restore reads this job's runner group (actions-cache-allowed.sh)
