name: Lint

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-lint.yml@f9f7c12294668a7eed9d89f277fab6cf4c8b4a63
    permissions:
      contents: read
      actions: read   # malf's conan cache restore reads this job's runner group (actions-cache-allowed.sh)
