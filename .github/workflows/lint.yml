name: Lint

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-lint.yml@d9827c46a6cfbccd10d7ff5ffa4d66c377a35bfc
    permissions:
      contents: read
      actions: read   # malf's conan cache restore reads this job's runner group (actions-cache-allowed.sh)
