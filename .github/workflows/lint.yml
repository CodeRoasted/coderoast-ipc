name: Lint

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-lint.yml@f8d7419618012dd0baae4fd7423735b5d3da0124
    permissions:
      contents: read
      actions: read   # malf's conan cache restore reads this job's runner group (actions-cache-allowed.sh)
