name: Release

# On a vX.Y.Z tag (or a manual re-run): attest -> publish. A RELEASE PUBLISHES FROM ITS CANDIDATE
# (DN-142.D33 (3), DN-142.D9): the cut dispatched this repository's candidate, which tested its sources
# and stored the ship form of coderoast_ipc_core, coderoast_ipc_consumer and coderoast_ipc_producer in
# this repository's own store; `publish` (malf's coderoast-publish.yml) reads that candidate at the key
# `attest` hands on, through its attestations (this repository is PUBLIC, and so is its store), and
# attaches every row packages.yml declares — the three package transports and the core benchmark JSON —
# with the Release's publication document, refusing unless every row resolves in the candidate, then
# reads the Release back equal to the staged files, both ways. Nothing here builds, tests, measures or
# packs; both jobs run on GitHub-hosted machines.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (vMAJOR.MINOR.PATCH)'
        required: true

permissions:
  contents: write   # create the Release at the existing tag and upload its assets
  packages: read    # `publish` reads this repository's own store package
  actions: read        # `attest` reads the superproject's cut runs; `publish` reads its own run's referenced workflows
  attestations: read   # `publish` trusts a public store's candidate through its attestations

jobs:
  # ── The tag's ONE gate: the tagged tree is the tree the cut judged ────────────────────────────
  # malf-toolchain's `coderoast-attest.yml` proves that the commit this tag points at is the commit
  # the cut's record (`cut.yml` in the private superproject) names for this repository, and the
  # commit its candidate was built at, and refuses the tag otherwise (DN-108.D7, DN-142.D33); it hands
  # on that candidate's `key`. Every other job in this file `needs: attest`, so a refusal lands before
  # anything publishes; `pin_coherence` INV-22 holds that shape in every releasing repository. Hosted
  # (no `runs-on`). `BUILD_RECORD_READ_TOKEN` is a fine-grained PAT whose repository access is
  # CodeRoasted/coderoast alone, `Actions: Read-only` and `Contents: Read-only`.
  attest:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-attest.yml@bbea1beae76c706dd1dc052672e0291222acfe72
    secrets:
      BUILD_RECORD_READ_TOKEN: ${{ secrets.BUILD_RECORD_READ_TOKEN }}

  publish:
    needs: attest
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-publish.yml@bbea1beae76c706dd1dc052672e0291222acfe72
    with:
      candidate-key: ${{ needs.attest.outputs.key }}
      cut-run: ${{ needs.attest.outputs.run }}
      record-sha256: ${{ needs.attest.outputs.record-sha256 }}
    secrets:
      BUILD_RECORD_READ_TOKEN: ${{ secrets.BUILD_RECORD_READ_TOKEN }}
