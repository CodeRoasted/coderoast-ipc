name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (vMAJOR.MINOR.PATCH)'
        required: true

permissions:
  contents: write
  # Sift needed permissions (PR + actions write)
  pull-requests: write
  actions: write

jobs:
  # ── The tag's ONE gate: the tagged tree is the tree step 0 judged ─────────────────────────────
  # malf-toolchain's `coderoast-attest.yml` proves that the commit this tag points at is the commit
  # step 0's build record (`pharos-build.yml` in the private superproject) verified for this
  # repository, and refuses the tag otherwise (DN-108.D7). Every other job in this file `needs:
  # attest`, so a refusal lands before anything builds or publishes; `pin_coherence` INV-22 holds
  # that shape in every releasing repository. Hosted (no `runs-on`): it compiles nothing, and a
  # release path takes no self-hosted runner it does not need. `BUILD_RECORD_READ_TOKEN` is a
  # fine-grained PAT whose only grant is `Actions: Read-only` on CodeRoasted/coderoast.
  attest:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-attest.yml@f4b2c08662282021d626495d2a8087c7d4c0a79f
    secrets:
      BUILD_RECORD_READ_TOKEN: ${{ secrets.BUILD_RECORD_READ_TOKEN }}

  ci:
    needs: attest
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  release:
    needs: [attest, ci]
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-release.yml@f4b2c08662282021d626495d2a8087c7d4c0a79f
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      packages: |
        coderoast_ipc_core:core
        coderoast_ipc_consumer:consumer
        coderoast_ipc_producer:producer
      benchmark: 'coderoast_ipc_core_bench=coderoast-ipc-core'
      benchmark-subdir: core
    secrets: inherit
