name: Release

# On a vX.Y.Z tag (or a manual re-run): attest -> publish. A RELEASE IS A PUBLICATION (DN-142.D9,
# ROADMAP N360): coderoast_ipc_core, coderoast_ipc_consumer and coderoast_ipc_producer were built,
# tested and judged once, at step 0, and stored by the writer, and the core benchmark ran inside its
# create as a verdict of its own (DN-142.D25 (5), call D); `publish` (malf's coderoast-publish.yml)
# attaches this repository's writer-signed slice of the attested step-0 record — the three package
# transports, the benchmark JSON and the slice — and reads the Release back equal to it, both ways.
# Nothing here builds, tests, measures or packs. This repository is PUBLIC, so both jobs run on
# GitHub-hosted machines, and `publish` reads the private `store-coderoast-ipc` package through this
# repository's Read grant on it.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (vMAJOR.MINOR.PATCH)'
        required: true

permissions:
  contents: write   # create the Release at the existing tag and upload its assets
  packages: read    # `publish` reads this repository's own store package
  actions: read     # `attest` reads the superproject's step-0 runs (malf coderoast-attest.yml asks it)

jobs:
  # ── The tag's ONE gate: the tagged tree is the tree step 0 judged ─────────────────────────────
  # malf-toolchain's `coderoast-attest.yml` proves that the commit this tag points at is the commit
  # step 0's build record (`pharos-build.yml` in the private superproject) verified for this
  # repository, and that a store writer sealed that record, and refuses the tag otherwise
  # (DN-108.D7). Every other job in this file `needs: attest`, so a refusal lands before anything
  # publishes; `pin_coherence` INV-22 holds that shape in every releasing repository. Hosted (no
  # `runs-on`). `BUILD_RECORD_READ_TOKEN` is a fine-grained PAT whose only grant is
  # `Actions: Read-only` on CodeRoasted/coderoast.
  attest:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-attest.yml@ab37dd51eb29e1beb7bc3c7af837a36963f2ff14
    secrets:
      BUILD_RECORD_READ_TOKEN: ${{ secrets.BUILD_RECORD_READ_TOKEN }}

  publish:
    needs: attest
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-publish.yml@ab37dd51eb29e1beb7bc3c7af837a36963f2ff14
    with:
      record-sha256: ${{ needs.attest.outputs.record-sha256 }}
