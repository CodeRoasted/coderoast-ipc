name: Postflight

# clang-tidy over a dev build ALREADY IN PLACE (malf-toolchain's coderoast-postflight.yml). It builds
# nothing and REFUSES without that build, so on this public repository's hosted machines it refuses by
# design: here the postflight runs inside CI's build job (`postflight: true`), the one job that holds the
# build. Dispatched alone, it serves a persistent runner that still holds one.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  postflight:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-postflight.yml@ab37dd51eb29e1beb7bc3c7af837a36963f2ff14
