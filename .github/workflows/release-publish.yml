name: Release publish
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (vMAJOR.MINOR.PATCH)'
        required: true

permissions:
  contents: write

concurrency:
  group: coderoast-ipc-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      CONAN_PROFILE: linux-gcc15-release

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip build-essential
          # Pin the dev-validated CMake 4.3.x workspace-wide (dev/CI parity). coderoast_server arms
          # `import std` (CXX_MODULE_STD, gated by the experimental UUID 451f2fe2 — present only in
          # CMake 4.3.x); Ubuntu's apt cmake (Noble 3.28) lacks that gate. Harmless / kept consistent
          # in repos that don't arm import std yet.
          sudo python3 -m pip install --break-system-packages "cmake==4.3.1"
          hash -r
          case "$(cmake --version | head -1)" in *" 4.3."*) cmake --version ;; *) echo "::error::expected CMake 4.3.x (got: $(cmake --version | head -1))"; exit 1 ;; esac

      - name: Provision gcc-15.3 toolchain (PR124309 fix; replaces PPA gcc-15 = 15.2)
        uses: CodeRoasted/malf-toolchain/.github/actions/setup-gcc153@main

      - name: Setup Conan
        uses: conan-io/setup-conan@v1
        with:
          version: "2.28.1"
          home: ${{ env.CONAN_HOME }}
          cache_packages: false
          profile_detect: false

      - name: Cache conan dep binaries (openssl/boost/drogon/… — keyed on the dep set + profile)
        uses: actions/cache@v5
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-gcc153-${{ runner.os }}-${{ hashFiles('**/conanfile.py', 'linux-gcc15-release') }}
          restore-keys: |
            conan-gcc153-${{ runner.os }}-

      - name: Setup Conan profile
        run: |
          mkdir -p "$CONAN_HOME/profiles"
          cp linux-gcc15-release "$CONAN_HOME/profiles/$CONAN_PROFILE"

      - name: Verify recipe version matches tag
        run: |
          version="$(sed -nE "s/^[[:space:]]*version[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"]/\1/p" conanfile.py | head -n1 || true)"
          if [[ "$version" != "${{ steps.tag.outputs.version }}" ]]; then
            echo "::error::conanfile.py version='$version' != tag '${{ steps.tag.outputs.tag }}'"
            exit 1
          fi

      - name: Build packages
        run: |
          # Create each sub-package to ensure they're in cache
          conan create core \
            --profile:host="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --profile:build="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --build=missing \
            --build-test=missing
          
          conan create consumer \
            --profile:host="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --profile:build="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --build=missing \
            --build-test=missing
          
          conan create producer \
            --profile:host="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --profile:build="$CONAN_HOME/profiles/$CONAN_PROFILE" \
            --build=missing \
            --build-test=missing

      - name: Export Conan packages as individual tarballs
        run: |
          mkdir -p release-assets
          
          # Save each sub-package individually so consumers download only what they need
          conan cache save "coderoast_ipc_core/${{ steps.tag.outputs.version }}" \
            --file="release-assets/coderoast_ipc_core-${{ steps.tag.outputs.version }}.tgz"
          conan cache save "coderoast_ipc_consumer/${{ steps.tag.outputs.version }}" \
            --file="release-assets/coderoast_ipc_consumer-${{ steps.tag.outputs.version }}.tgz"
          conan cache save "coderoast_ipc_producer/${{ steps.tag.outputs.version }}" \
            --file="release-assets/coderoast_ipc_producer-${{ steps.tag.outputs.version }}.tgz"

      - name: Attach tarballs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG"
          fi
          gh release upload "$TAG" release-assets/*.tgz --clobber
