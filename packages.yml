packages:
  coderoast_ipc_core:
    path: core
    version: 1.10.8
    source_public: true
    release: true
    depends: []
    # DN-142.D25 (5) call D: the verdict `coderoast_ipc_core/bench`, run inside this package's create under step 0's
    # `user.malf:bench`; each JSON is published under the name the hub collects.
    objects:
      bench/coderoast_ipc_core_bench.json: {published: {assets: [{name: coderoast-ipc-core-benchmark.json}]}}
  coderoast_ipc_consumer:
    path: consumer
    version: 1.10.8
    source_public: true
    release: true
    depends: [coderoast_ipc_core]
  coderoast_ipc_producer:
    path: producer
    version: 1.10.8
    source_public: true
    release: true
    depends: [coderoast_ipc_core]
  # DN-142.D29 (ix): the core's four segment arms that mount a private tmpfs in a fresh user, pid and
  # mount namespace (SegmentReservation x2, SegmentReaper x2), homed in a test-only package built
  # against the STORED core, so coderoast_ipc_core's own create runs confined and stays reusable.
  coderoast_ipc_namespace_tests:
    path: namespace_tests
    version: 1.10.8
    source_public: true
    release: false
    depends: [coderoast_ipc_core]
    unconfined:
      why: "every test here mounts a private tmpfs at /dev/shm inside a fresh user, pid and mount namespace, and a Landlock domain forbids any mount-topology change, even one granting the whole filesystem (DN-142.D29, verified with landlock_sandbox.py)"
